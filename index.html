<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A. Ikti Design | Айдентика & Frontend-разработка</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Шапка сайта -->
    <header class="header">
        <!-- Логотип-знак вернулся в левый верхний угол -->
        <div class="logo-block">
            <img src="logo-sign.png" alt="Логотип A. Ikti" class="header-sign">
        </div>
        <!-- Кнопки Услуги и Портфолио перенесены вправо -->
        <nav class="nav-right">
            <a href="#services">Услуги</a>
            <a href="#portfolio">Портфолио</a>
        </nav>
    </header>

    <!-- Главный экран -->
    <main class="hero">
        <div class="hero-center-content">
            
            <p class="hero-subtitle">Разработка айдентики & Frontend</p>
            
            <h1 class="hero-title">
                Создаю премиальный дизайн.<br>
                <span class="gold-text">Пишу безупречный код.</span>
            </h1>
            
            <p class="hero-description">
                Эксклюзивные логотипы, фирменный стиль и адаптивные сайты-визитки на чистом HTML, CSS и JavaScript. Без шаблонов, конструкторов и лишних переплат за платформы.
            </p>
            
            <div class="hero-actions">
                <!-- Кнопка теперь в легком контурном стиле -->
                <a href="#contacts" class="btn-outline">Обсудить проект</a>
            </div>
            
        </div>
    </main>

    <!-- Минималистичный подвал (Footer) -->
    <footer class="footer-branding">
        <!-- Огромная читаемая надпись теперь в самом низу вместо копирайта -->
        <img src="logo-text.png" alt="Design by A. Ikti" class="footer-text">
    </footer>

</body>
</html>
